---
GITHUB_COMMENT_REPORTER: false
DISABLE_LINTERS:
  # We are setting KUBERNETES_DIRECTORY to the helm chart so the
  # KUBERNETES_HELM linter can find the chart, but then this linter expects to
  # find raw Kubernetes manifests in this directory, which isn't the case.
  # If we added a PRE_ command with a `helm template` step, and further
  # restricted the included files for this linter, it *might* work.
  - KUBERNETES_KUBECONFORM
  # TBD how to use this from Megalinter with our setup.
  - KUBERNETES_KUBESCAPE
  # Repository-wide link checking returns mostly false positives (like internal
  # service URLs in templates).
  - SPELL_LYCHEE
  - SPELL_CSPELL
  # yamllint is sufficient for us.
  - YAML_PRETTIER
DISABLE_ERRORS_LINTERS:
  # This may be informative but doesn't need to break the build.
  - COPYPASTE_JSCPD
  # TBD! Need to work through these.
  - REPOSITORY_TRIVY
  - REPOSITORY_CHECKOV
  - REPOSITORY_DEVSKIM
YAML_YAMLLINT_CONFIG_FILE: .yamllint
# yamllint disable-line rule:line-length
REPOSITORY_KICS_ARGUMENTS: scan --no-progress --exclude-severities="medium,low,info,trace" --exclude-paths="gen/*"
SPELL_CSPELL_ANALYZE_FILE_NAMES: false
# Make sure Vale is setup to run with the styles it needs.
SPELL_VALE_PRE_COMMANDS:
  - command: mkdir -p styles
    cwd: "workspace"
  - command: vale sync
    cwd: "workspace"
API_SPECTRAL_FILTER_REGEX_EXCLUDE: "gen"
# Ignore YAML files with templating macros; these typically fail linting and/or
# schema checking.
FILTER_REGEX_EXCLUDE: '(templates/.*\.yml|templates/.*\.yaml|gen/.*)'
KUBERNETES_DIRECTORY: charts/lfx-v2-auth-service/templates
KUBERNETES_HELM_ARGUMENTS: charts/lfx-v2-auth-service
# The golangci-lint bundled with MegaLinter is built with Go 1.26 and cannot
# load a go 1.27.3 module. Install golangci-lint v2.15.0 (checksum verified)
# and let go download the go.mod toolchain. Remove once a MegaLinter release
# ships golangci-lint >= 2.15.0 and Go >= 1.27.3.
GO_GOLANGCI_LINT_PRE_COMMANDS:
  - command: >-
      go env -w GOTOOLCHAIN=auto &&
      curl -sSfL -o /tmp/golangci-lint.tar.gz
      https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz &&
      echo "9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea  /tmp/golangci-lint.tar.gz" | sha256sum -c - &&
      tar -xzf /tmp/golangci-lint.tar.gz -C /tmp &&
      install /tmp/golangci-lint-2.15.0-linux-amd64/golangci-lint /usr/bin/golangci-lint
    cwd: "workspace"

# The osv-scanner bundled with MegaLinter is built with Go 1.26, so its
# govulncheck step cannot load a go 1.27.3 module. Install osv-scanner
# v2.7.0 (built with Go 1.27, checksum verified). Remove with the
# golangci-lint block above.
REPOSITORY_OSV_SCANNER_PRE_COMMANDS:
  - command: >-
      go env -w GOTOOLCHAIN=auto &&
      curl -sSfL -o /tmp/osv-scanner
      https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 &&
      echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner" | sha256sum -c - &&
      install /tmp/osv-scanner /usr/bin/osv-scanner
    cwd: "workspace"
