---
# replicaCount is the number of replicas for the deployment
replicaCount: 3

# annotations are additional annotations applied to the Deployment itself.
# Example:
#   reloader.stakater.com/auto: "true"
annotations: {}

# podAnnotations are additional annotations applied to the pod template.
# Example:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
podAnnotations: {}

# podLabels are additional labels applied to the pod template.
# Example:
#   team: platform
#   environment: production
podLabels: {}

# podDisruptionBudget configures a PodDisruptionBudget for the deployment.
# Only one of minAvailable or maxUnavailable may be set (not both).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# topologySpreadConstraints controls how pods are spread across nodes/zones.
# Empty by default (no constraints). Example:
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels:
#         app: lfx-v2-auth-service
topologySpreadConstraints: []

image:
  repository: ghcr.io/linuxfoundation/lfx-v2-auth-service/server
  # tag is the container image tag (overrides appVersion from Chart.yaml)
  tag: ""
  # pullPolicy is the image pull policy
  pullPolicy: IfNotPresent

# service is the configuration for the Kubernetes service
service:
  # port is the service port
  port: 8080

# provisioningConsumer reads the Auth0 events stream and provisions CDP members
# for newly verified users. Opt-in, and it adds no inbound surface: the service
# opens the connection to Auth0.
#
# The stream fans out rather than load balancing, so only the replica holding
# the Lease reads it. The others stand by, and the RBAC below is what lets them
# compete for it.
provisioningConsumer:
  enabled: false

# outOfBandJobs holds what EVERY out-of-band CDP job shares.
#
# These settings are shared rather than per-job for a reason: CDP enforces its
# 200 req/min limit per M2M client, and every one of these jobs authenticates
# as the auth-service. They cannot starve the login Action, which is a
# different client — but they can starve each other and the provisioning
# consumer, which is why there is ONE rate allocation here and why the job
# schedules below are disjoint.
outOfBandJobs:
  # image is the backfill binary, published separately from the server.
  #
  # A deploy to staging or prod therefore pins TWO image tags — this one and
  # image.tag above — alongside the chart version. Bumping only one leaves the
  # jobs on the previous build with nothing else to show for it.
  image:
    repository: ghcr.io/linuxfoundation/lfx-v2-auth-service/backfill
    # tag is the container image tag (overrides appVersion from Chart.yaml)
    tag: ""
    # pullPolicy is the image pull policy
    pullPolicy: IfNotPresent

  # cdpRatePerMinute is the ONE CDP allocation every out-of-band job uses.
  #
  # CDP allows 200 req/min per M2M client. These jobs share that budget with the
  # provisioning consumer, not with the login Action, which authenticates as a
  # different client. Measured 2026-09-01: provisioning's busiest day wrote
  # 4,792 users at ~3.3/min, and at two to three CDP calls each that is ~10
  # req/min sustained, perhaps 20-30 at burst. 150 leaves that room and still
  # stops short of 200.
  #
  # Do NOT size this to the 800 req/min the production load test absorbed:
  # CDP's limiter is in-memory across two pods, so that headroom was two
  # half-sized buckets rather than budget, and traffic landing unevenly on one
  # pod would trip the real limit.
  cdpRatePerMinute: 150

  # suspend pauses EVERY out-of-band job.
  #
  # The Release Gate's parity half needs out-of-band writes quiesced for one
  # warehouse sync (~6h) before it runs, or its unsynced tail never reaches
  # zero. Set this true, upgrade, wait one sync, run the gate, set it back.
  # Suspending leaves the sweep's cursor untouched, so resuming carries on
  # rather than restarting.
  suspend: false

  # dryRun makes every job select and report without calling CDP or writing.
  dryRun: false

  # ttlSecondsAfterFinished cleans up finished Job objects. A day is long
  # enough to still read the logs of an overnight run.
  ttlSecondsAfterFinished: 86400
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# populationSweep pre-fills CDP UUIDs for the target cohort ahead of
# enablement, so most logins are cache hits rather than live resolves.
#
# Opt-in, and off by default: it walks the cohort against live CDP, so an
# environment that has not agreed a rate allocation should not start one. This
# flag gates both the CronJob and the cursor bucket below, so enabling the job
# and creating the cursor it opens cannot drift apart.
populationSweep:
  enabled: false

  # schedule runs the sweep every two hours, on the hour, UTC.
  #
  # ** The out-of-band jobs MUST NOT overlap. ** They share one CDP allocation
  # (outOfBandJobs.cdpRatePerMinute), and `concurrencyPolicy: Forbid` does not
  # help — it stops a job overlapping ITSELF and nothing more. Keeping them
  # apart is what these schedules are for:
  #
  #   sweep             0 */2 * * *   starts HH:00, runs up to 90m, ends HH+1:30
  #   no-match re-check               RESERVED: 30 3 * * *, inside the
  #                                   03:30-04:00 gap. The job arrives with
  #                                   T016b.
  #
  # ** That reservation is currently too small, and the gap has to be reshaped
  # before T016b lands. ** The re-check keeps no cursor and re-derives its
  # population every run, so a run cut short always covers the same prefix and
  # the tail is never reached -- which reopens the dormant-user gap with no
  # symptom. Measured 2026-09-01 its population is 16,202, which at 150 req/min
  # is ~108 minutes of calls. A 30-minute slot cannot hold a full pass.
  #
  # Changing either schedule or maxDurationMinutes means re-checking that the
  # windows still do not touch.
  schedule: "0 */2 * * *"

  # maxDurationMinutes stops a run in-process, keeping the position it reached.
  # Must stay inside the gap the schedule above leaves.
  maxDurationMinutes: 90

  # limit caps users processed per run; 0 means a run is bounded by
  # maxDurationMinutes and the rate allocation instead. At 150 req/min a 90
  # minute window reaches roughly 13,500 users.
  #
  # Sized on the 2026-09-01 re-measure: 38,416 active verified
  # database-connection users still carry no cdp_uuid_source, out of a cohort
  # of 89,308 -- the login path and provisioning have already marked 50,892.
  # Three runs clear that backlog, so an overnight start finishes by morning,
  # after which the sweep only picks up newly active users.
  limit: 0

  # pageSize is the Auth0 search page size.
  pageSize: 20

  # startOffset is how far back a COLD cursor begins, and it is what scopes the
  # sweep: the cohort query carries no upper bound and no rolling window, so
  # "active in the last 30 days" is expressed here and nowhere else. Once the
  # cursor has advanced, the sweep only ever looks forward.
  startOffset: 720h  # 30 days

# resources is the configuration for resource requests and limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nats:
  # url is the URL of the NATS server
  url: nats://lfx-platform-nats.lfx.svc.cluster.local:4222

  ## ** IMPORTANT **
  ## This should used for local development - it's disabled by default.
  ## If you set the REPO_TYPE to authelia, it should be enabled -> creation: true
  ##
  # authelia_users_kv_bucket is the configuration for the KV bucket for storing authelia_users
  authelia_users_kv_bucket:
    # creation is a boolean to determine if the KV bucket should be created via the helm chart.
    # set it to false if you want to use an existing KV bucket.
    creation: true
    # keep is a boolean to determine if the KV bucket should be preserved during helm uninstall
    # set it to false if you want the bucket to be deleted when the chart is uninstalled
    keep: true
    # name is the name of the KV bucket for storing projects
    name: authelia-users
    # history is the number of history entries to keep for the KV bucket
    history: 5
    # storage is the storage type for the KV bucket
    storage: file
    # maxValueSize is the maximum size of a value in the KV bucket
    maxValueSize: 1048576  # 1MB (sufficient for user data)
    # maxBytes is the maximum number of bytes in the KV bucket
    maxBytes: 10485760  # 10MB (sufficient for local dev testing)
    # compression is a boolean to determine if the KV bucket should be compressed
    compression: true

  authelia_email_otp_kv_bucket:
    # creation is a boolean to determine if the KV bucket should be created via the helm chart.
    # set it to false if you want to use an existing KV bucket.
    creation: true
    # keep is a boolean to determine if the KV bucket should be preserved during helm uninstall
    # set it to false if you want the bucket to be deleted when the chart is uninstalled
    keep: true
    # name is the name of the KV bucket for storing email OTP codes
    name: authelia-email-otp
    # history is the number of history entries to keep for the KV bucket
    history: 1
    # storage is the storage type for the KV bucket
    storage: file
    # maxValueSize is the maximum size of a value in the KV bucket
    maxValueSize: 1024  # 1KB (sufficient for OTP data)
    # maxBytes is the maximum number of bytes in the KV bucket
    maxBytes: 524288  # 512KB (smaller for local dev)
    # compression is a boolean to determine if the KV bucket should be compressed
    compression: true
    # ttl is the time-to-live for entries in the bucket (5 minutes for OTPs)
    ttl: 5m

  # provisioning_cursor_kv_bucket holds the Auth0 events stream position.
  # Created only when provisioningConsumer.enabled is true.
  provisioning_cursor_kv_bucket:
    # creation is a boolean to determine if the KV bucket should be created via the helm chart.
    # set it to false if you want to use an existing KV bucket.
    creation: true
    # keep is a boolean to determine if the KV bucket should be preserved during helm uninstall
    # set it to false if you want the bucket to be deleted when the chart is uninstalled
    keep: true
    # name is the name of the KV bucket for storing the stream position.
    # Rendered into PROVISIONING_CURSOR_BUCKET, so the bucket created here and
    # the one the consumer opens cannot drift apart.
    name: cdp-provisioning-cursor
    # history is the number of history entries to keep for the KV bucket
    history: 1
    # storage is the storage type for the KV bucket
    storage: file
    # maxValueSize is the maximum size of a value in the KV bucket
    maxValueSize: 4096  # 4KB (one opaque offset string)
    # maxBytes is the maximum number of bytes in the KV bucket
    maxBytes: 1048576  # 1MB (a single key, with room for history)
    # compression is a boolean to determine if the KV bucket should be compressed
    compression: false

  # sweep_cursor_kv_bucket holds the population sweep's single cursor.
  # Created only when populationSweep.enabled is true.
  sweep_cursor_kv_bucket:
    # creation is a boolean to determine if the KV bucket should be created via the helm chart.
    # set it to false if you want to use an existing KV bucket.
    creation: true
    # keep is a boolean to determine if the KV bucket should be preserved during helm uninstall
    # set it to false if you want the bucket to be deleted when the chart is uninstalled
    keep: true
    # name is the name of the KV bucket for storing the sweep cursor.
    # Rendered into SWEEP_CURSOR_BUCKET on the CronJob, so the bucket created
    # here and the one the sweep opens cannot drift apart.
    name: cdp-sweep-cursor
    # history is the number of history entries to keep for the KV bucket
    history: 1
    # storage is the storage type for the KV bucket
    storage: file
    # maxValueSize is the maximum size of a value in the KV bucket
    maxValueSize: 4096  # 4KB (one cursor record: timestamp, user id, run stats)
    # maxBytes is the maximum number of bytes in the KV bucket
    maxBytes: 1048576  # 1MB (a single key, with room for history)
    # compression is a boolean to determine if the KV bucket should be compressed
    compression: false

# serviceAccount is the configuration for the Kubernetes service account
## This will be used only if the USER_REPOSITORY_TYPE is authelia
serviceAccount:
  # create specifies whether a service account should be created
  create: true
  # name is the name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # annotations to add to the service account
  annotations: {}
  # automountServiceAccountToken is a boolean to determine if the service account token should be automatically mounted
  automountServiceAccountToken: true


# app is the configuration for the application
app:
  # use_oidc_contextualizer is a boolean to determine if the OIDC contextualizer should be used
  use_oidc_contextualizer: true
  # environment is the configuration for the application environment
  environment:
    # NATS Configuration
    NATS_URL:
      value: nats://lfx-platform-nats.lfx.svc.cluster.local:4222
    # Repository type for user management
    # It can be authelia, auth0 or mock
    # If not set, it will default to mock
    USER_REPOSITORY_TYPE:
      value: mock

    # Auth0 Management API configuration
    ## Optional when using mock or authelia repository type
    AUTH0_TENANT:
      value: null
    AUTH0_DOMAIN:
      value: null
    # Auth0 M2M Authentication configuration
    ## Required when using auth0 repository type
    AUTH0_M2M_CLIENT_ID:
      value: null
    AUTH0_M2M_PRIVATE_BASE64_KEY:
      value: null
    AUTH0_AUDIENCE:
      value: null
    AUTH0_MANAGEMENT_AUDIENCE:
      value: null
    # Auth0 LFX Profile Client configuration (Regular Web Application for passwordless flows)
    ## Required when using passwordless email linking flow
    AUTH0_LFX_PROFILE_CLIENT_ID:
      value: null
    AUTH0_LFX_PROFILE_CLIENT_SECRET:
      value: null
    # Auth0 LFX One Client configuration (user-facing SSR app)
    ## Required for sending password reset links
    AUTH0_LFX_ONE_CLIENT_ID:
      value: null

    # CDP provisioning configuration
    ## Required when provisioningConsumer.enabled is true. Without both of
    ## these the consumer does not start, rather than reading a stream it
    ## cannot act on.
    ##
    ## The out-of-band jobs need the same two, since they resolve against the
    ## same CDP API.
    CDP_BASE_URL:
      value: null
    CDP_AUDIENCE:
      value: null
    # How far back the consumer restarts when it has no usable position: a
    # cold start, or a position Auth0 has aged out. Auth0 does not publish its
    # retention, so this is generous on purpose — re-reading is cheap because
    # the gate skips anyone already provisioned. Defaults to 24h when unset.
    PROVISIONING_REPLAY_WINDOW:
      value: null
    # Overrides the host the events stream is read from. Unset means
    # AUTH0_DOMAIN, which in production is the tenant's custom domain.
    AUTH0_EVENTS_HOST:
      value: null
    # The Lease identity has to be unique per pod, and the Lease itself is
    # namespaced.
    POD_NAME:
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    POD_NAMESPACE:
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

    # Authelia configuration
    ## Required when using authelia repository type
    AUTHELIA_CONFIGMAP_NAME:
      value: authelia-users
    AUTHELIA_CONFIGMAP_NAMESPACE:
      value: lfx
    AUTHELIA_DAEMONSET_NAME:
      value: lfx-platform-authelia
    AUTHELIA_SECRET_NAME:
      value: authelia-users
    AUTHELIA_OIDC_USERINFO_URL:
      value: https://auth.k8s.orb.local/api/oidc/userinfo
  # extraEnv allows injecting additional environment variables before
  # other configurations
  extraEnv: []
  # otel is the configuration for OpenTelemetry tracing
  otel:
    # serviceName is the service name for OpenTelemetry resource identification
    # (default: "lfx-v2-auth-service")
    serviceName: ""
    # serviceVersion is the service version for OpenTelemetry resource
    # identification
    # (default: build-time version from ldflags)
    serviceVersion: ""
    # protocol specifies the OTLP protocol: "grpc" or "http"
    # (default: "grpc")
    protocol: "grpc"
    # endpoint is the OTLP collector endpoint
    # For gRPC: typically "host:4317", for HTTP: typically "host:4318"
    endpoint: ""
    # insecure disables TLS for the OTLP connection
    # Set to "true" for in-cluster communication without TLS
    insecure: "false"
    # tracesExporter specifies the traces exporter: "otlp" or "none"
    # (default: "none")
    tracesExporter: "none"
    # tracesSampler specifies the OTEL_TRACES_SAMPLER type. Supported values:
    # "always_on", "always_off", "traceidratio", "parentbased_always_on",
    # "parentbased_always_off", "parentbased_traceidratio".
    # When empty, the application defaults to parentbased_traceidratio.
    tracesSampler: ""
    # tracesSamplerArg specifies the OTEL_TRACES_SAMPLER_ARG (sampler ratio or parent_sampler_arg).
    # Used by "traceidratio" and "parentbased_traceidratio" samplers (defaults to 1.0 if empty).
    # (default: "")
    tracesSamplerArg: ""
    # metricsExporter specifies the metrics exporter: "otlp" or "none"
    # (default: "none")
    metricsExporter: "none"
    # logsExporter specifies the logs exporter: "otlp" or "none"
    # (default: "none")
    logsExporter: "none"
    # propagators specifies the propagators to use, comma-separated
    # Supported values: "tracecontext", "baggage", "jaeger"
    # (default: "tracecontext,baggage")
    propagators: "tracecontext,baggage,jaeger"
