---
{{- if .Values.provisioningWebhook.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.parentGateway.name }}
      sectionName: {{ .Values.parentGateway.sectionName }}
      namespace: {{ .Values.parentGateway.namespace }}
  hostnames:
    - "lfx-api.{{ .Values.lfx.domain }}"
  rules:
    # The Auth0 Event Stream provisioning webhook.
    #
    # No Heimdall filter is attached. The webhook destination can present only
    # a static secret, so there is no caller identity for the edge to validate,
    # and the handler performs the authorization itself.
    - matches:
        - path:
            type: Exact
            value: /webhooks/auth0/cdp-provisioning
          method: POST
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Chart.Name }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
