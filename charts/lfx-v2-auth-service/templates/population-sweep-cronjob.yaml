---
# The full-cohort population sweep. Walks users the login path has not reached
# yet, resolves each against live CDP and stores the result, so that most logins
# are cache hits by the time claim emission is switched on.
#
# Run one by hand with the same command the schedule uses:
#
#   kubectl -n <ns> create job --from=cronjob/lfx-v2-auth-service-population-sweep sweep-manual
#
# To rehearse without writing anything, set outOfBandJobs.dryRun=true and
# upgrade, or copy the Job and add --dry-run to its args.
#
# To PAUSE it — which the Release Gate's parity half requires, so out-of-band
# writes stop for one warehouse sync — set outOfBandJobs.suspend=true and
# upgrade, or for an unplanned stop:
#
#   kubectl -n <ns> patch cronjob lfx-v2-auth-service-population-sweep \
#     -p '{"spec":{"suspend":true}}'
#
# Suspending leaves the cursor untouched, so resuming carries on rather than
# restarting.
{{- if .Values.populationSweep.enabled }}
{{- $maxMinutes := int .Values.populationSweep.maxDurationMinutes }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-population-sweep
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: out-of-band-cdp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.populationSweep.schedule | quote }}
  # UTC regardless of where the cluster thinks it is, so the schedule stays
  # disjoint from the other out-of-band job across daylight-saving changes.
  timeZone: "Etc/UTC"
  suspend: {{ .Values.outOfBandJobs.suspend }}
  # Forbid keeps a slow run from overlapping ITSELF. It does nothing about the
  # other out-of-band job — that is what the disjoint schedules in values.yaml
  # are for, since both draw on one CDP allocation.
  concurrencyPolicy: Forbid
  # A missed run is not worth catching up: the cursor means the next one simply
  # covers more ground.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: {{ .Values.outOfBandJobs.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.outOfBandJobs.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: out-of-band-cdp
        tags.datadoghq.com/service: {{ .Chart.Name }}
    spec:
      ttlSecondsAfterFinished: {{ .Values.outOfBandJobs.ttlSecondsAfterFinished }}
      # No retry. The run is resumable from its cursor, so a failure costs the
      # remainder of one window and the next scheduled run picks up where this
      # one stopped — which is cheaper and less surprising than a retry racing
      # the schedule.
      backoffLimit: 0
      # The backstop for a run that ignores its own deadline. Deliberately
      # longer than --max-duration so the in-process stop happens first and
      # gets to record where it reached; this only fires if that failed.
      activeDeadlineSeconds: {{ add (mul $maxMinutes 60) 300 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/component: out-of-band-cdp
            tags.datadoghq.com/service: {{ .Chart.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: backfill
              image: "{{ .Values.outOfBandJobs.image.repository }}:{{ .Values.outOfBandJobs.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.outOfBandJobs.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
              args:
                - "--job"
                - "sweep"
                - "--rate"
                - {{ .Values.outOfBandJobs.cdpRatePerMinute | quote }}
                - "--limit"
                - {{ .Values.populationSweep.limit | quote }}
                - "--page-size"
                - {{ .Values.populationSweep.pageSize | quote }}
                - "--start-offset"
                - {{ .Values.populationSweep.startOffset | quote }}
                - "--max-duration"
                - "{{ $maxMinutes }}m"
                {{- if .Values.outOfBandJobs.dryRun }}
                - "--dry-run"
                {{- end }}
              env:
              # The same block the Deployment renders, so the job's Auth0 and
              # CDP configuration cannot drift from the service's. The keys it
              # does not use are inert.
              {{- range $name, $config := .Values.app.environment }}
              - name: {{ $name }}
                {{- if $config.value }}
                value: {{ $config.value | quote }}
                {{- else if $config.valueFrom }}
                valueFrom:
                  {{- toYaml $config.valueFrom | nindent 18 }}
                {{- end }}
              {{- end }}
              # Rendered from the same value that creates the bucket, so the one
              # the sweep opens and the one that exists cannot diverge.
              - name: SWEEP_CURSOR_BUCKET
                value: {{ .Values.nats.sweep_cursor_kv_bucket.name | quote }}
              # This job never reads the events stream; a stray true in
              # app.environment must not start one inside a batch pod.
              - name: PROVISIONING_CONSUMER_ENABLED
                value: "false"
              resources:
                {{- toYaml .Values.outOfBandJobs.resources | nindent 16 }}
{{- end }}
