---
name: Publish Main

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@v0.8
        with:
          version: v0.17.1
      - name: Build and publish auth-service images
        env:
          VERSION: development
          GIT_COMMIT: ${{ github.sha }}
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          export BUILD_TIME
          GIT_COMMIT=${GIT_COMMIT:0:7}
          export GIT_COMMIT
          ko build github.com/linuxfoundation/lfx-v2-auth-service/cmd/server \
            -B \
            --platform linux/amd64,linux/arm64 \
            -t ${{ github.sha }} \
            -t development \
            --sbom spdx

          # The out-of-band CDP jobs ship as a second image. `ko build` takes an
          # explicit package path, so the `backfill` stanza in .ko.yaml sets its
          # ldflags but does NOT cause it to be published — this line does. The
          # chart's CronJobs pull it, so without this they ImagePullBackOff.
          ko build github.com/linuxfoundation/lfx-v2-auth-service/cmd/backfill \
            -B \
            --platform linux/amd64,linux/arm64 \
            -t ${{ github.sha }} \
            -t development \
            --sbom spdx
