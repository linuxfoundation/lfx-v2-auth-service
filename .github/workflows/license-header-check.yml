---
# Copyright The Linux Foundation and each contributor to LFX.
# SPDX-License-Identifier: MIT
name: License Header Check

"on": [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  license-header-check:
    name: License Header Check
    # This pins the reusable workflow to the reviewed upstream main revision.
    uses: linuxfoundation/lfx-public-workflows/.github/workflows/license-header-check.yml@737873e045a02df2f66b09d8061b98997cdf1880  # yamllint disable-line rule:line-length
    with:
      copyright_line: "Copyright The Linux Foundation and each contributor to LFX."
      exclude_pattern: "gen"
